---
- name: Raise inotify watch/instance limits for containerized build tooling
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    reload: true
  become: true
  loop:
    - name: fs.inotify.max_user_watches
      value: "{{ concourse_worker_inotify_max_user_watches }}"
    - name: fs.inotify.max_user_instances
      value: "{{ concourse_worker_inotify_max_user_instances }}"
  loop_control:
    label: "{{ item.name }}"
  when: concourse_worker_manage_inotify_limits
  tags:
    - no-test

- name: Tune VM writeback/swap behaviour for a dedicated CI host
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    reload: true
  become: true
  loop:
    - name: vm.dirty_ratio
      value: "{{ concourse_worker_vm_dirty_ratio }}"
    - name: vm.dirty_background_ratio
      value: "{{ concourse_worker_vm_dirty_background_ratio }}"
    - name: vm.swappiness
      value: "{{ concourse_worker_vm_swappiness }}"
  loop_control:
    label: "{{ item.name }}"
  when: concourse_worker_manage_io_tuning
  tags:
    - no-test
