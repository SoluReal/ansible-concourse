---

# Maintenance variables

concourse_force_restart: false

# User variables

concourse_manage_user: true
concourse_user: concourse
concourse_uid: 14500
concourse_group: "{{ concourse_user }}"
concourse_gid: "{{ concourse_uid }}"

# Installation variables

# renovate: datasource=github-release-attachments depName=concourse/concourse
concourse_version: 8.3.0

# renovate: datasource=github-release-attachments depName=concourse/concourse digestVersion=v8.3.0
concourse_archive_checksum_arm64: "sha256:9a598825aa07089861272cd77f906f0a33379a46cbb2aa7d906d0a1fa63ac231"

# renovate: datasource=github-release-attachments depName=concourse/concourse digestVersion=v8.3.0
concourse_archive_checksum_amd64: "sha256:320b0cde214893378213d1f2f38eb515c55d0d8128185b076fd7ce555bf09e2c"

concourse_install_prefix_dir: /opt
concourse_install_dir: "{{ concourse_install_prefix_dir }}/concourse"
concourse_bin_dir: "{{ concourse_install_dir }}/bin"
concourse_binary_path: "{{ concourse_bin_dir }}/concourse"
concourse_etc_dir: "{{ concourse_install_dir }}/etc"
concourse_archive_name: "concourse-{{ concourse_version }}-{{ concourse_archive_os }}-{{ concourse_archive_arch }}.tgz"
concourse_archive_url: "https://github.com/concourse/concourse/releases/download/v{{ concourse_version }}/{{ concourse_archive_name }}"
concourse_archive_os: linux
concourse_archive_fetch_timeout: 30
concourse_archive_delete_after_unarchive: true
concourse_binary_mode: "0750"
concourse_etc_files_mode: "0400"

# Common Variables

concourse_service_enabled: true
concourse_service_start: true
#concourse_log_level: info
concourse_env_file: /etc/environment

# Web variables

concourse_web: false
#concourse_bind_ip:
#concourse_bind_port: 8080
#concourse_tls_bind_port: 443
#concourse_tls_certificate:
concourse_tls_certificate_path: "{{ concourse_etc_dir }}/tls_cert"
#concourse_tls_key:
concourse_tls_key_path: "{{ concourse_etc_dir }}/tls_key"
concourse_web_launcher_path: "{{ concourse_bin_dir }}/concourse-web"
concourse_web_launcher_mode: "0700"
concourse_cli_artifacts_dir: "{{ concourse_install_dir }}/fly-assets"
concourse_authorized_worker_keys_path: "{{ concourse_etc_dir }}/authorized_worker_keys"
concourse_host_key_path: "{{ concourse_etc_dir }}/host_key"
#concourse_session_signing_key:
concourse_session_signing_key_path: "{{ concourse_etc_dir }}/session_signing_key"
#concourse_encryption_key:
#concourse_old_encryption_key:
#concourse_host_key:
#concourse_authorized_worker_keys: []
#concourse_base_resource_type_defaults_file: "{{ concourse_etc_dir }}/base_resource_type_defaults.yml"
concourse_web_env: {}
# Shares resource-check volumes/results across pipelines instead of
# duplicating them per pipeline - cuts redundant checks and volume
# storage, which matters most once several pipelines share resources.
# Set to false to restore the previous role default.
concourse_enable_global_resources: true

# Web PostgreSQL variables
concourse_postgres_install: false
#concourse_postgres_host: localhost
#concourse_postgres_port: 5432
#concourse_postgres_user: concourse
#concourse_postgres_password: concourse
#concourse_postgres_database: concourse
#concourse_postgres_socket:
#concourse_postgres_ssl_mode:
#concourse_postgres_ca_cert:
#concourse_postgres_client_cert:
#concourse_postgres_client_key:
#concourse_postgres_connect_timeout:

# Worker variables

concourse_worker: false
concourse_worker_launcher_path: "{{ concourse_bin_dir }}/concourse-worker"
concourse_worker_binary_mode: "0700"
concourse_worker_land_path: "{{ concourse_bin_dir }}/concourse-land-worker"
concourse_worker_retire_path: "{{ concourse_bin_dir }}/concourse-retire-worker"
concourse_worker_land_on_stop: false
concourse_worker_retire_on_stop: true
concourse_work_dir: "{{ concourse_install_dir }}/work"
concourse_tsa_public_key_path: "{{ concourse_etc_dir }}/host_key.pub"
concourse_tsa_worker_key_path: "{{ concourse_etc_dir }}/worker_key"
#concourse_tsa_host:
#concourse_tsa_public_key:
#concourse_tsa_worker_key:
# overlay avoids baggageclaim's "naive" driver, which creates every
# volume with a full recursive file copy instead of a copy-on-write
# mount - a major throughput difference for a worker that's constantly
# creating/destroying volumes. Set to false to fall back to Concourse's
# own auto-detection.
concourse_baggageclaim_driver: overlay
concourse_worker_env: {}
# Worker filesystem variables

concourse_manage_work_volume: false
#concourse_work_volume_device:
concourse_work_volume_fs_type: "{% if concourse_baggageclaim_driver is defined and concourse_baggageclaim_driver == 'btrfs' %}btrfs{% else %}ext4{% endif %}"
concourse_work_volume_fs_opts: ""
concourse_work_volume_fs_force_create: false
concourse_work_volume_fs_resize: false
concourse_work_volume_mount_path: "{{ concourse_work_dir }}"
concourse_work_volume_mount_opts: "rw,noatime,nodiratime"

# Worker host tuning variables
#
# Containers on this host share the host's inotify limits (they are not
# namespaced), so build tooling using watch-mode/file-watching easily
# exhausts the stock Linux defaults and falls back to slow polling.
# Purely additive - raising these limits has no downside - so it's on
# by default.
concourse_worker_manage_inotify_limits: true
concourse_worker_inotify_max_user_watches: 1048576
concourse_worker_inotify_max_user_instances: 1024

# Off by default: these rewrite host-wide VM/writeback behaviour, which
# is only appropriate when this host is dedicated to running Concourse
# (no other workload's durability/latency expectations to consider).
concourse_worker_manage_io_tuning: false
concourse_worker_vm_dirty_ratio: 40
concourse_worker_vm_dirty_background_ratio: 10
concourse_worker_vm_swappiness: 10
